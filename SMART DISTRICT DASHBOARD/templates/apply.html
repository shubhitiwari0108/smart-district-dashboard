<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apply for Service</title>
<style>
body{font-family:Arial;background:#edf5ff;padding:20px}.box{max-width:600px;margin:25px auto;background:white;padding:28px;border-radius:12px}label{display:block;margin-top:14px}input,textarea,select{width:100%;padding:11px;margin-top:6px;border:1px solid #ccd8e5;border-radius:6px;box-sizing:border-box}button{margin-top:18px;padding:12px 20px;background:#0756a8;color:white;border:0;border-radius:6px;cursor:pointer}.msg{color:#087443}.err{color:#b42318}a{color:#0756a8}
</style>
</head>
<body>
<div class="box">
<h1>Apply for Service</h1>
{% if success %}<p class="msg">{{ success }}</p>{% endif %}
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="POST">
<label>Full Name</label><input name="name" required>
<label>Mobile Number</label><input name="mobile" type="tel" pattern="[0-9]{10}" maxlength="10" required>
<label>Service</label>
<select name="service" required>
<option value="">Choose service</option>
<option>Income Certificate</option>
<option>Domicile Certificate</option>
<option>Birth Certificate</option>
<option>Death Certificate</option>
<option>Other District Service</option>
</select>
<label>Address</label><input name="address" required>
<label>Application Details</label><textarea name="description" rows="4" required></textarea>
<button type="submit">Submit Application</button>
</form>
<p><a href="/citizen">Back to Dashboard</a></p>
</div>
</body>
</html>
