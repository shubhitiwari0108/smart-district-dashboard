<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register Grievance</title>
<style>
body{font-family:Arial;background:#edf5ff;padding:20px}.box{max-width:600px;margin:35px auto;background:white;padding:28px;border-radius:12px}label{display:block;margin-top:14px}input,textarea{width:100%;padding:12px;margin-top:6px;box-sizing:border-box;border:1px solid #ccd8e5;border-radius:6px}button{margin-top:18px;padding:12px 20px;background:#0756a8;color:white;border:0;border-radius:6px}.msg{color:#087443}.err{color:#b42318}a{color:#0756a8}
</style>
</head>
<body>
<div class="box">
<h1>Register Grievance</h1>
{% if success %}<p class="msg">{{ success }}</p>{% endif %}
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="POST">
<label>Grievance Subject</label>
<input name="subject" required>
<label>Describe Your Issue</label>
<textarea name="description" rows="5" required></textarea>
<button type="submit">Submit Grievance</button>
</form>
<p><a href="/citizen">Back to Dashboard</a></p>
</div>
</body>
</html>
